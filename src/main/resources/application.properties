# Application name
spring.application.name=spring-security-jwt-inmemory-demo

# PostgreSQL Database details
spring.datasource.url=jdbc:postgresql://localhost:5432/security_demo_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

# JWT Secret & Expiration (30 mins)
jwt.secret=ThisIsAVeryLongSecretKeyForJwtSigning1234567890
jwt.expiration-ms=1800000